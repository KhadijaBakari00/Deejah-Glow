<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Deejah’s Glow Ritual</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff7fa;--bg2:#ffe3ee;--card:#ffffff;--ink:#4a1f33;--mute:#9b6a80;--line:#f8d3e1;--accent:#e8588f;--accent2:#c93874}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#20121a;--bg2:#3a1c2b;--card:#2b1823;--ink:#ffe8f1;--mute:#d0a0b7;--line:#4d2a3d;--accent:#ff7fb0;--accent2:#ff9cc3}}
:root[data-theme="dark"]{--bg:#20121a;--bg2:#3a1c2b;--card:#2b1823;--ink:#ffe8f1;--mute:#d0a0b7;--line:#4d2a3d;--accent:#ff7fb0;--accent2:#ff9cc3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,var(--bg2),var(--bg) 340px) fixed,var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:10px 16px 44px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.hero{display:block;width:170px;max-width:50%;margin:0 auto;filter:drop-shadow(0 14px 18px rgba(201,56,116,.25));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(2deg)}}
h1{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:500;font-size:34px;text-align:center;margin:6px 0 0;line-height:1.05}
h1 b{font-style:normal;font-weight:600;color:var(--accent)}
.sub{text-align:center;color:var(--mute);font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin:8px 0 18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:4px;gap:4px}
.seg button{border:0;background:none;color:var(--mute);font:inherit;font-weight:700;padding:11px;border-radius:14px;cursor:pointer;transition:.2s;display:flex;gap:8px;align-items:center;justify-content:center}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 14px -4px rgba(232,88,143,.5)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0}
.day{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:50px;padding:10px 0 8px;font:inherit;font-weight:700;font-size:11px;cursor:pointer;position:relative;transition:.2s}
.day .d{width:18px;height:18px;border-radius:50%;margin:7px auto 0;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;color:transparent}
.day.full .d{background:var(--accent);border-color:var(--accent);color:#fff}
.day.hit{border-color:var(--accent);background:var(--bg2);box-shadow:0 0 0 3px var(--bg2)}
.day.on{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 14px -6px rgba(232,88,143,.6)}
.day.on .d{border-color:#fff}.day.on.full .d{background:#fff;color:var(--accent)}
.day.today::after{content:"";position:absolute;top:-4px;left:50%;margin-left:-4px;width:8px;height:8px;border-radius:50%;background:var(--accent2);border:2px solid var(--bg)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:30px;padding:22px 18px 18px;box-shadow:0 18px 34px -18px rgba(201,56,116,.45);position:relative;overflow:hidden}
.card.rest{background:linear-gradient(160deg,var(--card),var(--bg2))}
.top small{color:var(--mute);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.top h2{font-family:"Fraunces",Georgia,serif;font-size:28px;margin:2px 0 10px;font-weight:600}
.badge{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--bg2);color:var(--accent2)}
.meter{height:10px;border-radius:99px;background:var(--bg2);margin:16px 0 5px;overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffb3d0,var(--accent));transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.mlab{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);font-weight:700}
.slots{margin-top:14px;position:relative}
.slot{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:var(--ink);padding:7px 0;font:inherit;text-align:left;cursor:pointer;position:relative}
.bottle{width:62px;height:78px;border-radius:22px;display:grid;place-items:center;flex:none;background:var(--bg2);transition:transform .25s;border:1.5px solid var(--line)}
.bottle svg{width:38px;height:64px;filter:drop-shadow(0 3px 3px rgba(120,30,70,.25))}
.slot:hover .bottle{transform:rotate(-5deg) scale(1.04)}
.t{flex:1}.t small{display:flex;gap:5px;align-items:center;color:var(--mute);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.t b{font-family:"Fraunces",Georgia,serif;font-size:18px;font-weight:600;line-height:1.15;display:block;margin-top:2px}
.ck{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;transition:.25s;font-size:16px}
.slot.done .ck{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.12) rotate(360deg)}
.slot.done .t b{opacity:.5;text-decoration:line-through}
.msg{font-family:"Fraunces",Georgia,serif;font-style:italic;text-align:center;font-size:17px;margin-top:12px;min-height:24px;color:var(--accent2)}
h3{font-family:"Fraunces",Georgia,serif;font-size:24px;margin:30px 0 2px;text-align:center}
.hint{text-align:center;color:var(--mute);font-size:13px;margin:0 0 14px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sh{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:12px 6px 10px;text-align:center;color:var(--ink);font:inherit;cursor:pointer;transition:.2s}
.sh svg{width:46px;height:78px;filter:drop-shadow(0 4px 4px rgba(120,30,70,.25))}
.sh b{display:block;font-size:12px;line-height:1.2;margin-top:6px}
.sh small{display:block;color:var(--mute);font-size:10.5px;line-height:1.25;margin-top:3px}
.sh em{display:inline-block;font-style:normal;font-size:11px;font-weight:700;color:var(--accent2);background:var(--bg2);border-radius:99px;padding:2px 8px;margin-top:6px}
.sh.on{border-color:var(--accent);background:var(--bg2);transform:translateY(-3px);box-shadow:0 10px 18px -10px rgba(232,88,143,.7)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;font-size:13px;color:var(--mute);font-weight:700}
.foot button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;border-radius:99px;padding:8px 14px;cursor:pointer;display:flex;gap:6px;align-items:center}
.sp{position:absolute;pointer-events:none;width:18px;height:18px;color:var(--accent);animation:fly .9s ease-out forwards;z-index:5}
@keyframes fly{from{opacity:1;transform:translate(0,0) scale(.5)}to{opacity:0;transform:translate(var(--x),var(--y)) scale(1.3) rotate(120deg)}}
.hero{width:200px;max-width:56%}
.hero .head{animation:tilt 5s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(-1deg) translateY(-2px)}}
.hero .eye{animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.hero .pup{animation:glance 6s ease-in-out infinite}
@keyframes glance{0%,40%{transform:translateX(0)}50%,80%{transform:translateX(-4px)}90%,100%{transform:translateX(0)}}
.hero .tw use{animation:twk 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.hero .tw use:nth-child(2){animation-delay:.8s}.hero .tw use:nth-child(3){animation-delay:1.5s}
@keyframes twk{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
@media (prefers-reduced-motion:reduce){.hero,.hero *{animation:none!important}}

<h1>Deejah’s <b>Glow</b> Ritual</h1>
<p class="sub">Two weeks, one glow</p>
<div class="seg" id="weeks"><button data-w="0"><svg class="i"><use href="#sun"/></svg>Week 1</button><button data-w="1"><svg class="i"><use href="#moon"/></svg>Week 2</button></div>
<div class="days" id="days"></div>
<div class="card" id="card"><div class="top"><small id="wl"></small><h2 id="dn"></h2><span class="badge" id="st"></span></div>
<div class="meter"><i id="bar"></i></div><div class="mlab"><span>Today’s glow</span><span id="pct"></span></div>
<div class="slots" id="slots"></div><div class="msg" id="msg"></div></div>
<h3>Your shelf</h3><p class="hint">Tap a bottle to see which days you use it</p>
<div class="shelf" id="shelf"></div>
<div class="foot"><span id="prog"></span><button id="reset"><svg class="i"><use href="#reset"/></svg>Reset week</button></div>
</div>
<script>
var PR={
G:{n:"Golden Glow exfoliating gel",s:"Golden Glow gel",d:"Turmeric, carrot, alpha arbutin"},
GL:{n:"Golden Glow lotion",s:"Golden Glow lotion",d:"Carrot oil, turmeric, glutathione, SPF 55"},
E:{n:"Empirical Glow body wash",s:"Empirical Glow wash",d:"Vitamin C and glycolic acid"},
K:{n:"Advanced Korean Skin lotion",s:"Advanced Korean Skin",d:"Tranexamic, kojic and azelaic acids, ceramides"},
P:{n:"Plain moisturizer",s:"Plain moisturizer",d:"Nivea, Vaseline, whatever you have"},
W:{n:"Plain gentle wash",s:"Plain gentle wash",d:"Your gentle everyday wash"}};
var ORDER=["G","GL","E","K","P","W"];
var DN=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],D=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var G="G",E="E",K="K",P="P",W="W",GL="GL";
var R=[[
[G,P,P,"Active wash only"],[G,P,P,"Active wash only"],[W,K,P,"Gentle day lotion only"],[W,P,P,"100% true rest day"],[E,P,P,"Active wash only"],[W,K,GL,"Active lotion day"],[W,P,P,"100% true rest day"]],[
[G,P,GL,"Golden Glow day"],[G,P,P,"Active wash only"],[W,K,GL,"Active lotion day"],[W,P,P,"Rest day"],[E,P,GL,"Empirical + night lotion"],[E,K,P,"Empirical + day lotion"],[W,P,P,"Rest day"]]];
function I(n){return '<svg class="i"><use href="#'+n+'"/></svg>'}
function B(p){return '<svg viewBox="0 0 60 100"><use href="#b-'+p+'"/></svg>'}
var S={w:0,d:0,f:null},C={},lab=[["sun","Shower wash"],["sun","Morning lotion"],["moon","Night lotion"]];
var t=(new Date().getDay()+6)%7;S.d=t;
try{C=JSON.parse(localStorage.getItem("glowC3")||"{}");var s=JSON.parse(localStorage.getItem("glowS3")||"{}");if(s.w!==undefined)S.w=s.w}catch(e){}
function save(){try{localStorage.setItem("glowC3",JSON.stringify(C));localStorage.setItem("glowS3",JSON.stringify({w:S.w}))}catch(e){}}
function k(w,d,i){return w+"-"+d+"-"+i}
function cnt(w,d){var n=0;for(var i=0;i<3;i++)if(C[k(w,d,i)])n++;return n}
function uses(w,p){var a=[];for(var d=0;d<7;d++){var r=R[w][d];if(r[0]==p||r[1]==p||r[2]==p)a.push(d)}return a}
function burst(el){var r=el.getBoundingClientRect(),c=document.getElementById("card").getBoundingClientRect();
for(var i=0;i<7;i++){var s=document.createElement("span");s.className="sp";s.innerHTML=I("spark");s.firstChild.style.fill="currentColor";
s.style.left=(r.left-c.left+r.width-30)+"px";s.style.top=(r.top-c.top+10)+"px";
s.style.setProperty("--x",(Math.random()*120-60)+"px");s.style.setProperty("--y",(-Math.random()*80-20)+"px");
document.getElementById("card").appendChild(s);setTimeout(function(x){x.remove()},900,s)}}
function render(){
document.querySelectorAll("#weeks button").forEach(function(b){b.className=b.dataset.w==S.w?"on":""});
var hit=S.f?uses(S.w,S.f):[];
var h="";D.forEach(function(x,i){h+='<button class="day'+(i==S.d?' on':'')+(i==t?' today':'')+(cnt(S.w,i)==3?' full':'')+(hit.indexOf(i)>-1?' hit':'')+'" data-d="'+i+'">'+x+'<span class="d">'+I("check")+'</span></button>'});
document.getElementById("days").innerHTML=h;
var r=R[S.w][S.d],rest=/rest/i.test(r[3]);
document.getElementById("card").className="card"+(rest?" rest":"");
document.getElementById("wl").textContent="Week "+(S.w+1);
document.getElementById("dn").textContent=DN[S.d];
document.getElementById("st").innerHTML=I(rest?"leaf":"spark")+r[3];
var sl="";for(var i=0;i<3;i++){var p=r[i];sl+='<button class="slot'+(C[k(S.w,S.d,i)]?' done':'')+'" data-i="'+i+'"><span class="bottle">'+B(p)+'</span><span class="t"><small>'+I(lab[i][0])+lab[i][1]+'</small><b>'+PR[p].n+'</b></span><span class="ck">'+I("check")+'</span></button>'}
document.getElementById("slots").innerHTML=sl;
var n=cnt(S.w,S.d);
document.getElementById("bar").style.width=(n/3*100)+"%";
document.getElementById("pct").textContent=n+" / 3";
document.getElementById("msg").textContent=n==3?(rest?"Rested and radiant":"Glowing, queen!"):n==0?(rest?"Easy day. Let your skin breathe.":"Tap each step as you go"):"Keep going, almost there!";
var sh="";ORDER.forEach(function(p){var u=uses(S.w,p).length;sh+='<button class="sh'+(S.f==p?' on':'')+'" data-p="'+p+'">'+B(p)+'<b>'+PR[p].s+'</b><small>'+PR[p].d+'</small><em>'+u+(u==1?' day':' days')+'</em></button>'});
document.getElementById("shelf").innerHTML=sh;
var tot=0;for(var d=0;d<7;d++)tot+=cnt(S.w,d);
document.getElementById("prog").textContent="Week glow: "+tot+" / 21 steps";
}
document.getElementById("weeks").onclick=function(e){var b=e.target.closest("button");if(b){S.w=+b.dataset.w;save();render()}};
document.getElementById("days").onclick=function(e){var b=e.target.closest("button");if(b){S.d=+b.dataset.d;render()}};
document.getElementById("shelf").onclick=function(e){var b=e.target.closest("button");if(b){S.f=S.f==b.dataset.p?null:b.dataset.p;render()}};
document.getElementById("slots").onclick=function(e){var b=e.target.closest("button");if(b){var i=+b.dataset.i,q=k(S.w,S.d,i);C[q]=!C[q];save();var on=C[q];render();if(on){var n=document.querySelector('.slot[data-i="'+i+'"]');if(n)burst(n)}}};
document.getElementById("reset").onclick=function(){for(var d=0;d<7;d++)for(var i=0;i<3;i++)delete C[k(S.w,d,i)];save();render()};
render();
</script></body></html>
